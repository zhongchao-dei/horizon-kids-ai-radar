name: DeepSeek connection diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Test one minimal DeepSeek request
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          key = os.environ.get("DEEPSEEK_API_KEY", "")
          if not key:
              print("SECRET_STATUS=missing")
              sys.exit(1)

          payload = json.dumps({
              "model": "deepseek-v4-flash",
              "messages": [{"role": "user", "content": "Reply with OK."}],
              "max_tokens": 8,
              "stream": False,
          }).encode()
          request = urllib.request.Request(
              "https://api.deepseek.com/chat/completions",
              data=payload,
              headers={
                  "Authorization": f"Bearer {key}",
                  "Content-Type": "application/json",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=45) as response:
                  data = json.load(response)
                  print(f"HTTP_STATUS={response.status}")
                  print(f"MODEL={data.get('model', 'unknown')}")
                  print("API_STATUS=ok")
          except urllib.error.HTTPError as exc:
              print(f"HTTP_STATUS={exc.code}")
              try:
                  data = json.loads(exc.read().decode("utf-8", errors="replace"))
                  error = data.get("error", {})
                  print(f"ERROR_CODE={error.get('code', 'unknown')}")
                  print(f"ERROR_TYPE={error.get('type', 'unknown')}")
                  print(f"ERROR_MESSAGE={error.get('message', 'unknown')}")
              except Exception:
                  print("ERROR_MESSAGE=unreadable response")
              sys.exit(1)
          PY

name: Daily Horizon Summary

on:
  schedule:
    # GitHub scheduled workflows use UTC. 01:30 UTC is 09:30 Asia/Shanghai.
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      provider:
        description: '本次运行使用的 AI 服务'
        required: true
        default: 'deepseek'
        type: choice
        options:
          - gemini
          - deepseek

concurrency:
  group: horizon-daily-summary
  cancel-in-progress: false

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Select AI provider
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PROVIDER: ${{ inputs.provider }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_PROVIDER" == "gemini" ]]; then
            cp data/config.github.json data/config.json
            echo "HORIZON_PROVIDER=gemini" >> "$GITHUB_ENV"
          else
            cp data/config.github.deepseek.json data/config.json
            echo "HORIZON_PROVIDER=deepseek" >> "$GITHUB_ENV"
          fi

      - name: Run Horizon
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Using provider: $HORIZON_PROVIDER"
          uv run horizon --hours 24

      - name: Set current date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "📝 Daily Summary: ${{ env.DATE }} (${{ env.HORIZON_PROVIDER }})"
          publish_branch: gh-pages
          enable_jekyll: true

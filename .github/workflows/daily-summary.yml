name: Daily Horizon Summary

on:
  schedule:
    # Primary run at 09:30. Two later watchdog runs recover a delayed or
    # dropped GitHub schedule; complete same-day output is detected and skipped.
    - cron: '30 9 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '30 10 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '30 12 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:
    inputs:
      provider:
        description: '本次运行优先使用的 AI 服务'
        required: true
        default: 'deepseek'
        type: choice
        options:
          - gemini
          - deepseek

concurrency:
  group: horizon-daily-summary
  cancel-in-progress: false

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check whether today's three artifacts already exist
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          DATE="$(date +'%Y-%m-%d')"
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          echo "SKIP_RUN=false" >> "$GITHUB_ENV"

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            BASE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/_posts"
            complete=true
            for artifact in all-candidates parent-topics teacher-topics; do
              file="/tmp/${artifact}.md"
              if ! curl -fsSL "${BASE_URL}/${DATE}-${artifact}-zh.md?watchdog=${GITHUB_RUN_ID}" -o "$file" \
                || ! grep -q "^artifact: ${artifact}$" "$file"; then
                complete=false
              fi
            done
            if [[ "$complete" == "true" ]]; then
              echo "Today's complete candidate pool and both topic paths already exist; watchdog run will stop here."
              echo "SKIP_RUN=true" >> "$GITHUB_ENV"
            fi
          fi

      - name: Set up Python
        if: env.SKIP_RUN != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        if: env.SKIP_RUN != 'true'
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        if: env.SKIP_RUN != 'true'
        run: uv sync

      - name: Select AI provider
        if: env.SKIP_RUN != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PROVIDER: ${{ inputs.provider }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_PROVIDER" == "gemini" ]]; then
            cp data/config.github.json data/config.json
            echo "HORIZON_PROVIDER=gemini" >> "$GITHUB_ENV"
          else
            cp data/config.github.deepseek.json data/config.json
            echo "HORIZON_PROVIDER=deepseek" >> "$GITHUB_ENV"
          fi

      - name: Run Horizon
        if: env.SKIP_RUN != 'true'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Using provider: $HORIZON_PROVIDER"
          uv run horizon --hours 24

      - name: Deploy to GitHub Pages
        if: env.SKIP_RUN != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "📝 K12 AI 双路径日报: ${{ env.DATE }} (${{ env.HORIZON_PROVIDER }})"
          publish_branch: gh-pages
          enable_jekyll: true

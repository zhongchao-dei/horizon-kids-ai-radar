theme: jekyll-theme-cayman
title: 儿童 AI 教育新闻雷达
description: 面向小学三年级至初中阶段家长的 AI 教育每日情报
baseurl: "/horizon-kids-ai-radar"
url: "https://zhongchao-dei.github.io"

# Build settings
markdown: kramdown
future: true # Allow future posts to be published
plugins:
  - jekyll-feed
feed:
  path: feed.xml
exclude:
  - ".github"
  - "node_modules"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
